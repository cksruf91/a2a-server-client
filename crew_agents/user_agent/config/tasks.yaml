find_user_name_task:
  description: >
    question: {question}
    Given a question, analyze it to find a userID and use the userID to find the user's name.
    If there's no userID in the question, request userID from the user.
    If looking up the user's name returns null or empty, it means the user is not registered.
    Please inform that the user is not registered.
  expected_output: >
    user name or inform message
  agent: user_agent

find_user_address_task:
  description: >
    question: {question}
    Given a question, analyze it to find a userID and use the userID to retrieve the user's address.
    If there's no userID in the question, request userID from the user.
    If looking up the user's address returns null or empty, it means the user is not registered or address information is not available.
    Please inform that the address information is not available.
  expected_output: >
    user address or inform message
  agent: user_agent

find_user_booked_items_task:
  description: >
    question: {question}
    Given a question, analyze it to find a userID and use the userID to retrieve the list of items booked by the user.
    If there's no userID in the question, request userID from the user.
    If looking up the user's booked items returns null or empty, it means the user has no booked items or is not registered.
    Please inform that there are no booked items or the user is not registered.
  expected_output: >
    list of booked items or inform message
  agent: user_agent