orchestration_task:
  description: >
    Handle user request: {user_input}

    Analyze the user's request and coordinate with available agents to provide a comprehensive response.
    Use the appropriate agents based on the request type:
    - For user information: use user_agent tools
    - For product information: use product_agent tools
    - For travel recommendations and information: use travel_guide_agent tools
  expected_output: >
    A comprehensive response to the user's request in the same language they used
  agent: host_agent
